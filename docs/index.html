<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>논문 라디오</title>
<meta name="description" content="JITAI · 웨어러블 · mHealth 최신 논문을 한국어 라디오로">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0f172a">
<style>
:root {
  --bg: #f6f7fb; --card: #ffffff; --ink: #1a2233; --sub: #5b6478;
  --line: #e4e7ef; --accent: #2563eb; --accent-ink: #ffffff;
  --chip: #eaeefb; --chip-ink: #33415c; --tag: #eef1f6;
  --shadow: 0 1px 3px rgba(15,23,42,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1420; --card: #171e2e; --ink: #e8ecf5; --sub: #93a0b8;
    --line: #26304a; --accent: #5b8cff; --accent-ink: #0b1020;
    --chip: #1f2a44; --chip-ink: #c3cee6; --tag: #202a42;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  line-height: 1.6; padding-bottom: 90px;
}
header {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding: 16px 16px 8px; border-bottom: 1px solid var(--line);
}
header h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
header .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: none; border-radius: 999px; padding: 7px 14px;
  background: var(--chip); color: var(--chip-ink); font-size: 13px; cursor: pointer;
}
.chip.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
main { max-width: 720px; margin: 0 auto; padding: 12px 16px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); cursor: pointer;
}
.card .title { font-size: 15.5px; font-weight: 700; }
.card .one { font-size: 13.5px; color: var(--sub); margin-top: 4px; }
.row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.tag { font-size: 11.5px; background: var(--tag); color: var(--sub); border-radius: 6px; padding: 2px 8px; }
.jr { font-size: 12px; color: var(--sub); margin-left: auto; }
.playbtn {
  border: none; border-radius: 999px; width: 40px; height: 40px; flex: 0 0 40px;
  background: var(--accent); color: var(--accent-ink); font-size: 16px; cursor: pointer;
}
.playbtn.none { background: var(--tag); color: var(--sub); }
.cardtop { display: flex; gap: 12px; align-items: flex-start; }
.cardtop > div:first-child { flex: 1; }
/* detail */
#detail { display: none; }
#detail.show { display: block; }
#list.hide { display: none; }
.back { background: none; border: none; color: var(--accent); font-size: 15px; cursor: pointer; padding: 8px 0; }
.dtitle { font-size: 20px; font-weight: 800; line-height: 1.4; }
.dorig { font-size: 13.5px; color: var(--sub); margin-top: 6px; }
.dmeta { font-size: 13px; color: var(--sub); margin-top: 10px; }
.dbtns { display: flex; gap: 10px; margin: 16px 0; }
.btn {
  flex: 1; text-align: center; border-radius: 12px; padding: 12px; font-size: 14.5px;
  font-weight: 600; cursor: pointer; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); text-decoration: none;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.summary { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px 14px; }
.summary h2 { font-size: 15px; margin: 16px 0 6px; color: var(--accent); }
.summary p { font-size: 14.5px; margin: 8px 0; }
.empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 14px; }
/* player bar */
#player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: none;
}
#player.show { display: block; }
.pwrap { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.ptitle { flex: 1; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptime { font-size: 11.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
#seek { width: 100%; margin-top: 6px; accent-color: var(--accent); height: 4px; }
#speed { border: 1px solid var(--line); background: none; color: var(--sub); border-radius: 8px; font-size: 12px; padding: 4px 8px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🎙️ 논문 라디오 <span style="font-size:12px;font-weight:400;color:var(--sub)">mHealth 연구 브리핑</span></h1>
  <div class="meta" id="gen"></div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div id="list"></div>
  <div id="detail"></div>
</main>

<div id="player">
  <div class="pwrap">
    <button class="playbtn" id="ppbtn">▶</button>
    <div style="flex:1;min-width:0">
      <div class="ptitle" id="ptitle"></div>
      <div class="ptime"><span id="pcur">0:00</span> / <span id="pdur">0:00</span></div>
    </div>
    <button id="speed">1.0x</button>
  </div>
  <div class="pwrap"><input type="range" id="seek" min="0" max="100" value="0"></div>
</div>

<audio id="audio" preload="none"></audio>

<script>
let DB = [], filter = "전체", audioOnly = false;
const $ = id => document.getElementById(id);
const audio = $("audio");
const speeds = [1.0, 1.25, 1.5, 2.0];
let speedIdx = 0, currentId = null;

const TOPICS = ["전체", "JITAI", "웨어러블", "당뇨", "비만", "운동", "🎧 오디오만"];

function fmt(s) {
  if (!isFinite(s)) return "0:00";
  s = Math.floor(s);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function esc(t) {
  const d = document.createElement("div"); d.textContent = t || ""; return d.innerHTML;
}

function md(text) {
  return (text || "").split(/\n\n+/).map(block => {
    block = block.trim();
    if (block.startsWith("## ")) {
      const [h, ...rest] = block.split("\n");
      return "<h2>" + esc(h.slice(3)) + "</h2>" + (rest.length ? "<p>" + inline(rest.join(" ")) + "</p>" : "");
    }
    return "<p>" + inline(block) + "</p>";
  }).join("");
}
function inline(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }

function renderChips() {
  $("chips").innerHTML = TOPICS.map(t => {
    const on = (t === "🎧 오디오만") ? audioOnly : (filter === t && !audioOnly) || (audioOnly && filter === t && t !== "전체");
    const cls = ((t === "🎧 오디오만" && audioOnly) || (t !== "🎧 오디오만" && filter === t)) ? "chip on" : "chip";
    return `<button class="${cls}" data-t="${t}">${t}</button>`;
  }).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    if (t === "🎧 오디오만") audioOnly = !audioOnly;
    else filter = t;
    renderChips(); renderList();
  });
}

function visible() {
  return DB.filter(p =>
    (filter === "전체" || p.topics.includes(filter)) && (!audioOnly || p.has_audio)
  );
}

function renderList() {
  const items = visible();
  $("list").innerHTML = items.length ? items.map(p => `
    <div class="card" data-id="${p.id}">
      <div class="cardtop">
        <div>
          <div class="title">${esc(p.title_ko || p.title)}</div>
          ${p.one_liner ? `<div class="one">${esc(p.one_liner)}</div>` : `<div class="one">${esc(p.title_ko ? p.title : "")}</div>`}
        </div>
        <button class="playbtn ${p.has_audio ? "" : "none"}" data-play="${p.id}">${p.has_audio ? "▶" : "…"}</button>
      </div>
      <div class="row">
        ${p.topics.map(t => `<span class="tag">${t}</span>`).join("")}
        <span class="jr">${esc(p.journal)} · ${p.year}</span>
      </div>
    </div>`).join("") : `<div class="empty">해당 조건의 논문이 없습니다</div>`;

  document.querySelectorAll(".card").forEach(c => c.onclick = e => {
    if (e.target.dataset.play !== undefined && e.target.dataset.play !== "") return;
    location.hash = "p/" + c.dataset.id;
  });
  document.querySelectorAll("[data-play]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const p = DB.find(x => x.id === b.dataset.play);
    if (p && p.has_audio) togglePlay(p);
  });
}

function renderDetail(id) {
  const p = DB.find(x => x.id === id);
  if (!p) { location.hash = ""; return; }
  $("detail").innerHTML = `
    <button class="back">← 목록으로</button>
    <div class="dtitle">${esc(p.title_ko || p.title)}</div>
    ${p.title_ko ? `<div class="dorig">${esc(p.title)}</div>` : ""}
    <div class="dmeta">
      ${esc(p.journal)} · ${p.year}${p.pub_date ? " · " + p.pub_date : ""}<br>
      ${esc(p.authors)}<br>
      ${p.affiliation ? "🏛️ " + esc(p.affiliation) : ""}
    </div>
    <div class="row" style="margin-top:8px">${p.topics.map(t => `<span class="tag">${t}</span>`).join("")}</div>
    <div class="dbtns">
      ${p.has_audio ? `<button class="btn primary" id="dplay">🎧 라디오 듣기</button>` : ""}
      ${p.url ? `<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">📄 원문 보기</a>` : ""}
    </div>
    ${p.summary_md ? `<div class="summary">${md(p.summary_md)}</div>` : `<div class="empty">요약이 아직 생성되지 않았습니다.<br>다음 파이프라인 실행 시 추가됩니다.</div>`}
  `;
  document.querySelector(".back").onclick = () => { location.hash = ""; };
  const dp = $("dplay");
  if (dp) dp.onclick = () => togglePlay(p);
  $("list").classList.add("hide");
  $("detail").classList.add("show");
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash;
  if (h.startsWith("#p/")) renderDetail(h.slice(3));
  else { $("detail").classList.remove("show"); $("list").classList.remove("hide"); }
}

function togglePlay(p) {
  if (currentId === p.id && !audio.paused) { audio.pause(); return; }
  if (currentId !== p.id) {
    currentId = p.id;
    audio.src = "audio/" + p.id + ".mp3";
    $("ptitle").textContent = p.title_ko || p.title;
    $("player").classList.add("show");
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: p.title_ko || p.title, artist: "논문 라디오", album: p.journal
      });
    }
  }
  audio.playbackRate = speeds[speedIdx];
  audio.play();
}

audio.onplay = () => { $("ppbtn").textContent = "⏸"; };
audio.onpause = () => { $("ppbtn").textContent = "▶"; };
audio.ontimeupdate = () => {
  $("pcur").textContent = fmt(audio.currentTime);
  $("pdur").textContent = fmt(audio.duration);
  if (isFinite(audio.duration)) $("seek").value = (audio.currentTime / audio.duration) * 100;
};
$("seek").oninput = () => {
  if (isFinite(audio.duration)) audio.currentTime = ($("seek").value / 100) * audio.duration;
};
$("ppbtn").onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
$("speed").onclick = () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  audio.playbackRate = speeds[speedIdx];
  $("speed").textContent = speeds[speedIdx].toFixed(2).replace(/0$/, "") + "x";
};

window.addEventListener("hashchange", route);

fetch("app-data.json?v=" + Date.now()).then(r => r.json()).then(d => {
  DB = d.papers;
  $("gen").textContent = `논문 ${DB.length}편 · 오디오 ${DB.filter(p => p.has_audio).length}편 · ${d.generated} 업데이트`;
  renderChips(); renderList(); route();
}).catch(() => { $("list").innerHTML = `<div class="empty">app-data.json을 불러오지 못했습니다</div>`; });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
